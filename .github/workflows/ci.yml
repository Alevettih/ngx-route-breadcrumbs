name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  publish:
    needs: quality-checks
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: npm
      url: https://www.npmjs.com/package/@alevettih/ngx-route-breadcrumbs
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Publish package
        run: npm publish --access public
        working-directory: dist/ngx-route-breadcrumbs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
